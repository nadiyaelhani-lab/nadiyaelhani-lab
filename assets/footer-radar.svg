<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 112" width="1200" height="112" role="img" aria-label="Nadiya El Hani — Dashboard Footer">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060A15"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060A15"/>
    </linearGradient>
    <linearGradient id="fStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style><![CDATA[
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes glide {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .beam { animation: glide 4.8s linear infinite; }
    .dot { animation: pulse 2s ease-in-out infinite; }
  ]]></style>

  <clipPath id="fc">
    <rect x="2" y="2" width="1196" height="108" rx="18"/>
  </clipPath>

  <g clip-path="url(#fc)">
    <rect x="0" y="0" width="1200" height="112" fill="url(#fBg)"/>
    <rect class="beam" x="0" y="0" width="320" height="2.5" fill="url(#sweep)"/>

    <text x="600" y="48" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#E2E8F0">
      "Every line of code is an opportunity to learn something new."
    </text>

    <circle class="dot" cx="352" cy="78" r="3.5" fill="#4ADE80"/>
    <text x="606" y="82" text-anchor="middle" class="mono" font-size="11.5" fill="#94A3B8">NADIYA EL HANI  ·  YOUCODE SAFI × 42 FIRENZE  ·  OPEN TO COLLABORATE</text>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="109" rx="18" fill="none" stroke="url(#fStroke)" stroke-width="1.4"/>
</svg>
