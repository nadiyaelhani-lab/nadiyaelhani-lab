<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 215" width="580" height="215" role="img" aria-label="Smart Stream TV V2 Project Card">
  <style><![CDATA[
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  ]]></style>

  <rect x="1" y="1" width="578" height="213" rx="14" fill="#171411" stroke="#2E2924" stroke-width="1.2"/>
  <rect x="24" y="1" width="56" height="3" rx="1.5" fill="#C96A4B"/>

  <!-- Top Row -->
  <text x="24" y="34" class="mono" font-size="10.5" fill="#A89F91" letter-spacing="1.2">01 / WEB APPLICATION</text>
  <rect x="444" y="18" width="112" height="22" rx="11" fill="#1F2921" stroke="#6B8F71" stroke-opacity="0.55"/>
  <circle cx="458" cy="29" r="3" fill="#6B8F71"/>
  <text x="468" y="33" class="mono" font-size="10" fill="#B6D1BA">LIVE · PAGES</text>

  <!-- Title & Summary -->
  <text x="24" y="72" class="serif" font-size="22" font-weight="700" fill="#F3EDE4">Smart Stream TV V2</text>
  <text x="24" y="98" class="sans" font-size="12.5" fill="#A89F91">Interactive IPTV channel manager built</text>
  <text x="24" y="117" class="sans" font-size="12.5" fill="#A89F91">with MockAPI CRUD, favorites &amp; blacklist.</text>

  <!-- Architectural Wireframe Diagram (Right) -->
  <g transform="translate(384, 54)">
    <rect x="0" y="0" width="172" height="96" rx="10" fill="#1C1916" stroke="#2E2924"/>
    <rect x="10" y="12" width="46" height="72" rx="4" fill="#141210" stroke="#2E2924"/>
    <rect x="15" y="18" width="36" height="10" rx="2" fill="#C96A4B"/>
    <rect x="15" y="33" width="36" height="8" rx="2" fill="#2E2924"/>
    <rect x="15" y="45" width="36" height="8" rx="2" fill="#2E2924"/>
    <rect x="15" y="57" width="36" height="8" rx="2" fill="#2E2924"/>

    <rect x="64" y="12" width="98" height="52" rx="5" fill="#141210" stroke="#3D352E"/>
    <polygon points="108,30 108,46 122,38" fill="#D4A373"/>
    <text x="64" y="78" class="mono" font-size="8.5" fill="#A89F91">GET · POST · PUT · DEL</text>
  </g>

  <!-- Footer Strip -->
  <line x1="24" y1="166" x2="556" y2="166" stroke="#2E2924" stroke-width="1"/>
  <text x="24" y="191" class="mono" font-size="11" fill="#D4A373">JS ES6+  ·  Tailwind CSS  ·  MockAPI</text>
  <text x="556" y="191" text-anchor="end" class="mono" font-size="11" fill="#A89F91">Repository →</text>
</svg>
