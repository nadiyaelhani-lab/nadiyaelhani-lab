<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="580" height="230" role="img" aria-label="Smart Stream TV V2 Project Card">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1224"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="85%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strokePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <style><![CDATA[
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes eq1 { 0%, 100% { height: 10px; y: 74px; } 50% { height: 22px; y: 62px; } }
    @keyframes eq2 { 0%, 100% { height: 20px; y: 64px; } 50% { height: 9px; y: 75px; } }
    @keyframes eq3 { 0%, 100% { height: 14px; y: 70px; } 50% { height: 24px; y: 60px; } }
    .live { animation: pulse 1.8s ease-in-out infinite; }
    .b1 { animation: eq1 1.4s ease-in-out infinite; }
    .b2 { animation: eq2 1.1s ease-in-out infinite; }
    .b3 { animation: eq3 1.6s ease-in-out infinite; }
  ]]></style>

  <rect x="1.5" y="1.5" width="577" height="227" rx="18" fill="url(#bg)" stroke="url(#strokePurple)" stroke-width="1.5"/>
  <rect x="2" y="2" width="576" height="226" rx="18" fill="url(#glowPurple)"/>

  <!-- Header Badge -->
  <rect x="24" y="22" width="138" height="24" rx="12" fill="#052E16" stroke="#22C55E" stroke-opacity="0.6"/>
  <circle class="live" cx="38" cy="34" r="3.5" fill="#4ADE80"/>
  <text x="48" y="38" class="mono" font-size="10.5" fill="#86EFAC" font-weight="600">LIVE · GH PAGES</text>

  <text x="556" y="38" text-anchor="end" class="mono" font-size="11" fill="#C084FC">FLAGSHIP ↗</text>

  <!-- Title & Desc -->
  <text x="24" y="78" class="sans" font-size="22" font-weight="800" fill="#FFFFFF">Smart Stream TV V2</text>
  <text x="24" y="103" class="sans" font-size="12.5" fill="#94A3B8">Interactive IPTV dashboard with MockAPI</text>
  <text x="24" y="122" class="sans" font-size="12.5" fill="#94A3B8">CRUD, favorites, blacklist &amp; live preview.</text>

  <!-- Mini Animated TV UI Widget (Right Side) -->
  <g transform="translate(382, 54)">
    <rect x="0" y="0" width="174" height="104" rx="12" fill="#0B1120" stroke="#475569" stroke-opacity="0.5"/>
    <!-- Mini sidebar -->
    <rect x="8" y="10" width="52" height="84" rx="6" fill="#111827"/>
    <rect x="13" y="16" width="42" height="12" rx="3" fill="#7C3AED"/>
    <rect x="13" y="33" width="42" height="10" rx="3" fill="#1E293B"/>
    <rect x="13" y="47" width="42" height="10" rx="3" fill="#1E293B"/>
    <rect x="13" y="61" width="42" height="10" rx="3" fill="#1E293B"/>
    <!-- Mini player -->
    <rect x="66" y="10" width="100" height="62" rx="7" fill="url(#screenGrad)" stroke="#A855F7" stroke-opacity="0.45"/>
    <polygon points="110,32 110,50 126,41" fill="#E9D5FF"/>
    <text x="74" y="23" class="mono" font-size="8" fill="#F472B6">● LIVE</text>
    <!-- Animated Equalizer Bars -->
    <rect class="b1" x="142" y="74" width="4" height="10" rx="1.5" fill="#C084FC"/>
    <rect class="b2" x="149" y="64" width="4" height="20" rx="1.5" fill="#38BDF8"/>
    <rect class="b3" x="156" y="70" width="4" height="14" rx="1.5" fill="#818CF8"/>
    <text x="68" y="88" class="mono" font-size="8.5" fill="#94A3B8">CRUD · ★ · 🚫</text>
  </g>

  <!-- Tech Pills -->
  <line x1="24" y1="172" x2="556" y2="172" stroke="#1E293B" stroke-width="1"/>
  <rect x="24" y="186" width="84" height="24" rx="7" fill="#1E1B4B" stroke="#6366F1" stroke-opacity="0.5"/>
  <text x="66" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#C7D2FE">JS ES6+</text>

  <rect x="116" y="186" width="92" height="24" rx="7" fill="#083344" stroke="#06B6D4" stroke-opacity="0.5"/>
  <text x="162" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#A5F3FC">Tailwind</text>

  <rect x="216" y="186" width="82" height="24" rx="7" fill="#2E1065" stroke="#A855F7" stroke-opacity="0.5"/>
  <text x="257" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#E9D5FF">MockAPI</text>

  <rect x="306" y="186" width="86" height="24" rx="7" fill="#0F172A" stroke="#334155"/>
  <text x="349" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">Fetch API</text>

  <text x="556" y="202" text-anchor="end" class="mono" font-size="10.5" fill="#94A3B8">Click to explore →</text>
</svg>
