<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 215" width="580" height="215" role="img" aria-label="AUCHAN'Co E-Commerce Project Card">
  <style><![CDATA[
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  ]]></style>

  <rect x="1" y="1" width="578" height="213" rx="14" fill="#171411" stroke="#2E2924" stroke-width="1.2"/>
  <rect x="24" y="1" width="56" height="3" rx="1.5" fill="#D4A373"/>

  <!-- Top Row -->
  <text x="24" y="34" class="mono" font-size="10.5" fill="#A89F91" letter-spacing="1.2">02 / E-COMMERCE CATALOG</text>
  <rect x="440" y="18" width="116" height="22" rx="11" fill="#2A2118" stroke="#D4A373" stroke-opacity="0.5"/>
  <circle cx="454" cy="29" r="3" fill="#D4A373"/>
  <text x="464" y="33" class="mono" font-size="10" fill="#E6C9A8">IN PROGRESS</text>

  <!-- Title & Summary -->
  <text x="24" y="72" class="serif" font-size="22" font-weight="700" fill="#F3EDE4">AUCHAN'Co Storefront</text>
  <text x="24" y="98" class="sans" font-size="12.5" fill="#A89F91">Modular ES6 storefront with JSON fetch,</text>
  <text x="24" y="117" class="sans" font-size="12.5" fill="#A89F91">category filters, pagination &amp; drag cart.</text>

  <!-- Architectural Wireframe Diagram (Right) -->
  <g transform="translate(384, 54)">
    <rect x="0" y="0" width="172" height="96" rx="10" fill="#1C1916" stroke="#2E2924"/>
    <rect x="10" y="10" width="152" height="12" rx="3" fill="#141210" stroke="#2E2924"/>
    <rect x="10" y="28" width="46" height="32" rx="4" fill="#141210" stroke="#2E2924"/>
    <rect x="63" y="28" width="46" height="32" rx="4" fill="#141210" stroke="#2E2924"/>
    <rect x="116" y="28" width="46" height="32" rx="4" fill="#29211B" stroke="#D4A373" stroke-opacity="0.7"/>
    <rect x="10" y="67" width="152" height="19" rx="4" fill="#141210" stroke="#C96A4B" stroke-dasharray="3,3" stroke-opacity="0.8"/>
    <text x="86" y="80" text-anchor="middle" class="mono" font-size="8" fill="#D4A373">CART DROP ZONE</text>
  </g>

  <!-- Footer Strip -->
  <line x1="24" y1="166" x2="556" y2="166" stroke="#2E2924" stroke-width="1"/>
  <text x="24" y="191" class="mono" font-size="11" fill="#D4A373">ES6 Modules  ·  Tailwind  ·  JSON</text>
  <text x="556" y="191" text-anchor="end" class="mono" font-size="11" fill="#A89F91">Repository →</text>
</svg>
