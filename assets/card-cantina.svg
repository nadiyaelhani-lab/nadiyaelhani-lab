<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="580" height="230" role="img" aria-label="Cantina Weekly Menu Planner Project Card">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1325"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <radialGradient id="glowSky" cx="85%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strokeSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="budgetBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <style><![CDATA[
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes fillMeter { 0% { width: 24px; } 50% { width: 122px; } 100% { width: 108px; } }
    .live { animation: pulse 1.8s ease-in-out infinite; }
    .meter { animation: fillMeter 3.4s ease-in-out infinite; }
  ]]></style>

  <rect x="1.5" y="1.5" width="577" height="227" rx="18" fill="url(#bg)" stroke="url(#strokeSky)" stroke-width="1.5"/>
  <rect x="2" y="2" width="576" height="226" rx="18" fill="url(#glowSky)"/>

  <!-- Status Badge -->
  <rect x="24" y="22" width="128" height="24" rx="12" fill="#052E16" stroke="#22C55E" stroke-opacity="0.6"/>
  <circle class="live" cx="38" cy="34" r="3.5" fill="#4ADE80"/>
  <text x="48" y="38" class="mono" font-size="10.5" fill="#86EFAC" font-weight="600">LIVE · VERCEL</text>

  <text x="556" y="38" text-anchor="end" class="mono" font-size="11" fill="#38BDF8">WEB APP ↗</text>

  <!-- Title & Desc -->
  <text x="24" y="78" class="sans" font-size="22" font-weight="800" fill="#FFFFFF">Cantina — Menu Planner</text>
  <text x="24" y="103" class="sans" font-size="12.5" fill="#94A3B8">YouCode canteen app with modal recipes,</text>
  <text x="24" y="122" class="sans" font-size="12.5" fill="#94A3B8">live Regex validation &amp; 50 DH/day cap.</text>

  <!-- Mini Animated Budget Planner Widget -->
  <g transform="translate(382, 54)">
    <rect x="0" y="0" width="174" height="104" rx="12" fill="#0B1120" stroke="#475569" stroke-opacity="0.5"/>
    <text x="12" y="20" class="mono" font-size="8.5" fill="#38BDF8">WEEKLY BUDGET CAP</text>
    <text x="12" y="38" class="sans" font-size="15" font-weight="800" fill="#FFFFFF">50 DH <tspan class="mono" font-size="9" fill="#94A3B8">/ day</tspan></text>
    <!-- Animated Gauge -->
    <rect x="12" y="48" width="150" height="8" rx="4" fill="#1E293B"/>
    <rect class="meter" x="12" y="48" width="108" height="8" rx="4" fill="url(#budgetBar)"/>
    <!-- Day pills -->
    <rect x="12" y="68" width="26" height="22" rx="5" fill="#064E3B"/>
    <text x="25" y="83" text-anchor="middle" class="mono" font-size="8.5" fill="#A7F3D0">MON</text>
    <rect x="43" y="68" width="26" height="22" rx="5" fill="#064E3B"/>
    <text x="56" y="83" text-anchor="middle" class="mono" font-size="8.5" fill="#A7F3D0">TUE</text>
    <rect x="74" y="68" width="26" height="22" rx="5" fill="#1E3A8A"/>
    <text x="87" y="83" text-anchor="middle" class="mono" font-size="8.5" fill="#BFDBFE">WED</text>
    <rect x="105" y="68" width="26" height="22" rx="5" fill="#1E293B"/>
    <text x="118" y="83" text-anchor="middle" class="mono" font-size="8.5" fill="#94A3B8">THU</text>
    <rect x="136" y="68" width="26" height="22" rx="5" fill="#1E293B"/>
    <text x="149" y="83" text-anchor="middle" class="mono" font-size="8.5" fill="#94A3B8">FRI</text>
  </g>

  <!-- Tech Pills -->
  <line x1="24" y1="172" x2="556" y2="172" stroke="#1E293B" stroke-width="1"/>
  <rect x="24" y="186" width="96" height="24" rx="7" fill="#2E1065" stroke="#8B5CF6" stroke-opacity="0.5"/>
  <text x="72" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#DDD6FE">Bootstrap 5</text>

  <rect x="128" y="186" width="90" height="24" rx="7" fill="#1E293B" stroke="#FACC15" stroke-opacity="0.4"/>
  <text x="173" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#FEF08A">Vanilla JS</text>

  <rect x="226" y="186" width="76" height="24" rx="7" fill="#083344" stroke="#38BDF8" stroke-opacity="0.5"/>
  <text x="264" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#BAE6FD">Regex</text>

  <rect x="310" y="186" width="76" height="24" rx="7" fill="#0F172A" stroke="#334155"/>
  <text x="348" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">Vercel</text>

  <text x="556" y="202" text-anchor="end" class="mono" font-size="10.5" fill="#94A3B8">Click to explore →</text>
</svg>
