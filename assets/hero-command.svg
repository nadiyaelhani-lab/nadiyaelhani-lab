<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-label="Nadiya El Hani — Editorial Developer Overview">
  <defs>
    <linearGradient id="baseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171411"/>
      <stop offset="100%" stop-color="#12100E"/>
    </linearGradient>

    <linearGradient id="warmWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C96A4B" stop-opacity="0.09"/>
      <stop offset="45%" stop-color="#D4A373" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#12100E" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Moroccan 8-point Zellige architectural lattice -->
    <pattern id="zellige" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M24 2 L30 18 L46 24 L30 30 L24 46 L18 30 L2 24 L18 18 Z" fill="none" stroke="#D4A373" stroke-opacity="0.065" stroke-width="0.9"/>
      <rect x="14" y="14" width="20" height="20" fill="none" stroke="#C96A4B" stroke-opacity="0.045" stroke-width="0.8" transform="rotate(45 24 24)"/>
      <circle cx="24" cy="24" r="2.2" fill="none" stroke="#D4A373" stroke-opacity="0.06" stroke-width="0.8"/>
    </pattern>

    <clipPath id="heroClip">
      <rect x="1" y="1" width="1198" height="308" rx="16"/>
    </clipPath>
  </defs>

  <style><![CDATA[
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes gentlePulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.45; }
    }
    @keyframes drawLine {
      from { stroke-dashoffset: 180; }
      to { stroke-dashoffset: 0; }
    }
    .status-dot { animation: gentlePulse 3.6s ease-in-out infinite; }
    .spark { stroke-dasharray: 180; animation: drawLine 1.6s ease-out forwards; }
  ]]></style>

  <g clip-path="url(#heroClip)">
    <rect x="0" y="0" width="1200" height="310" fill="url(#baseBg)"/>
    <rect x="0" y="0" width="1200" height="310" fill="url(#warmWash)"/>

    <!-- Subtle Zellige lattice accent on far right architectural band -->
    <rect x="640" y="0" width="560" height="310" fill="url(#zellige)"/>

    <!-- Thin Terracotta Top Accent Rule -->
    <rect x="0" y="0" width="1200" height="3" fill="#C96A4B"/>

    <!-- Editorial Top Bar -->
    <text x="44" y="42" class="mono" font-size="11" fill="#A89F91" letter-spacing="1.8">SAFI, MOROCCO  ·  42 FIRENZE</text>

    <circle class="status-dot" cx="1010" cy="38" r="3.5" fill="#6B8F71"/>
    <text x="1156" y="42" text-anchor="end" class="mono" font-size="11" fill="#A89F91">OPEN TO COLLABORATE</text>

    <line x1="44" y1="60" x2="1156" y2="60" stroke="#2E2924" stroke-width="1"/>

    <!-- LEFT COLUMN: Editorial Identity -->
    <text x="44" y="122" class="serif" font-size="44" font-weight="700" fill="#F3EDE4" letter-spacing="-0.4">Nadiya El Hani</text>
    <rect x="44" y="138" width="48" height="2.5" rx="1.25" fill="#C96A4B"/>

    <text x="44" y="172" class="sans" font-size="16" font-weight="600" fill="#D4A373">Software Development Student — Web Engineering &amp; C Systems</text>

    <text x="44" y="204" class="sans" font-size="13.5" fill="#A89F91">Studying full-stack JavaScript at YouCode Safi while advancing through</text>
    <text x="44" y="225" class="sans" font-size="13.5" fill="#A89F91">the 42 Firenze Common Core after validating the C Piscine at Level 4.55.</text>

    <!-- Quiet Architectural Metadata Footer Row (Left) -->
    <line x1="44" y1="252" x2="620" y2="252" stroke="#2E2924" stroke-width="1"/>
    <text x="44" y="278" class="mono" font-size="11" fill="#78716C">TRACKS</text>
    <text x="108" y="278" class="sans" font-size="12" fill="#E5DDD0">JavaScript ES6+ · Tailwind · Bootstrap · C · Unix · Git Flow</text>

    <!-- RIGHT COLUMN: TrackPulse-Inspired 2x2 Executive KPI Grid -->
    <!-- Vertical Separator -->
    <line x1="654" y1="78" x2="654" y2="286" stroke="#2E2924" stroke-width="1"/>

    <!-- KPI Tile 1: 42 Piscine Level -->
    <rect x="684" y="80" width="224" height="94" rx="10" fill="#1C1916" stroke="#2E2924" stroke-width="1"/>
    <text x="702" y="104" class="mono" font-size="10" fill="#A89F91" letter-spacing="1.2">42 C PISCINE</text>
    <text x="890" y="104" text-anchor="end" class="mono" font-size="10" fill="#6B8F71">PASSED</text>
    <text x="702" y="144" class="sans" font-size="30" font-weight="700" fill="#F3EDE4">4.55</text>
    <text x="774" y="144" class="mono" font-size="11" fill="#D4A373">Peak 85%</text>
    <text x="702" y="162" class="sans" font-size="11" fill="#78716C">9/14 modules · Final Exam 60%</text>

    <!-- KPI Tile 2: GitHub Velocity -->
    <rect x="924" y="80" width="232" height="94" rx="10" fill="#1C1916" stroke="#2E2924" stroke-width="1"/>
    <text x="942" y="104" class="mono" font-size="10" fill="#A89F91" letter-spacing="1.2">PUBLIC REPOS</text>
    <text x="1138" y="104" text-anchor="end" class="mono" font-size="10" fill="#D4A373">2 MONTHS</text>
    <text x="942" y="144" class="sans" font-size="30" font-weight="700" fill="#F3EDE4">08</text>
    <!-- Subtle TrackPulse Sparkline -->
    <path class="spark" d="M 1018 144 L 1042 138 L 1066 132 L 1090 135 L 1114 122 L 1136 116" fill="none" stroke="#C96A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1136" cy="116" r="3" fill="#C96A4B"/>
    <text x="942" y="162" class="sans" font-size="11" fill="#78716C">Structured PRs &amp; Agile issues</text>

    <!-- KPI Tile 3: Live Shipments -->
    <rect x="684" y="190" width="224" height="94" rx="10" fill="#1C1916" stroke="#2E2924" stroke-width="1"/>
    <text x="702" y="214" class="mono" font-size="10" fill="#A89F91" letter-spacing="1.2">DEPLOYED APPS</text>
    <text x="890" y="214" text-anchor="end" class="mono" font-size="10" fill="#6B8F71">LIVE</text>
    <text x="702" y="254" class="sans" font-size="30" font-weight="700" fill="#F3EDE4">02</text>
    <text x="748" y="254" class="mono" font-size="11" fill="#A89F91">Pages · Vercel</text>
    <text x="702" y="272" class="sans" font-size="11" fill="#78716C">Smart Stream V2 &amp; Cantina</text>

    <!-- KPI Tile 4: Active Milestone -->
    <rect x="924" y="190" width="232" height="94" rx="10" fill="#1C1916" stroke="#2E2924" stroke-width="1"/>
    <text x="942" y="214" class="mono" font-size="10" fill="#A89F91" letter-spacing="1.2">ACTIVE MILESTONE</text>
    <text x="1138" y="214" text-anchor="end" class="mono" font-size="10" fill="#C96A4B">42 CURSUS</text>
    <text x="942" y="254" class="serif" font-size="27" font-weight="700" fill="#F3EDE4">Libft</text>
    <text x="1014" y="254" class="mono" font-size="11" fill="#D4A373">C Library</text>
    <text x="942" y="272" class="sans" font-size="11" fill="#78716C">Cadet @ 42 Firenze (nael-han)</text>
  </g>

  <rect x="1" y="1" width="1198" height="308" rx="16" fill="none" stroke="#2E2924" stroke-width="1.2"/>
</svg>
