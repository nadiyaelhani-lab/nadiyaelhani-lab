<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 215" width="580" height="215" role="img" aria-label="Election Manager CLI Project Card">
  <style><![CDATA[
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  ]]></style>

  <rect x="1" y="1" width="578" height="213" rx="14" fill="#171411" stroke="#2E2924" stroke-width="1.2"/>
  <rect x="24" y="1" width="56" height="3" rx="1.5" fill="#9C7A54"/>

  <!-- Top Row -->
  <text x="24" y="34" class="mono" font-size="10.5" fill="#A89F91" letter-spacing="1.2">04 / CLI &amp; ALGORITHMS</text>
  <rect x="466" y="18" width="90" height="22" rx="11" fill="#1C1916" stroke="#443D36"/>
  <text x="511" y="33" text-anchor="middle" class="mono" font-size="10" fill="#D4A373">NODE.JS</text>

  <!-- Title & Summary -->
  <text x="24" y="72" class="serif" font-size="22" font-weight="700" fill="#F3EDE4">Election Manager CLI</text>
  <text x="24" y="98" class="sans" font-size="12.5" fill="#A89F91">Node.js voting tool with candidate CRUD,</text>
  <text x="24" y="117" class="sans" font-size="12.5" fill="#A89F91">CIN deduplication, sorting &amp; party stats.</text>

  <!-- Architectural Wireframe Diagram (Right) -->
  <g transform="translate(384, 54)">
    <rect x="0" y="0" width="172" height="96" rx="10" fill="#1C1916" stroke="#2E2924"/>
    <text x="12" y="20" class="mono" font-size="8.5" fill="#D4A373">RANKING DISTRIBUTION</text>
    <rect x="12" y="32" width="122" height="9" rx="3" fill="#C96A4B"/>
    <text x="142" y="40" class="mono" font-size="8.5" fill="#E5DDD0">#1</text>
    <rect x="12" y="49" width="92" height="9" rx="3" fill="#D4A373"/>
    <text x="112" y="57" class="mono" font-size="8.5" fill="#A89F91">#2</text>
    <rect x="12" y="66" width="64" height="9" rx="3" fill="#6B8F71"/>
    <text x="84" y="74" class="mono" font-size="8.5" fill="#A89F91">#3</text>
    <text x="12" y="89" class="mono" font-size="7.5" fill="#78716C">UNIQUE CIN VALIDATION</text>
  </g>

  <!-- Footer Strip -->
  <line x1="24" y1="166" x2="556" y2="166" stroke="#2E2924" stroke-width="1"/>
  <text x="24" y="191" class="mono" font-size="11" fill="#D4A373">Node.js  ·  Algorithms  ·  CRUD</text>
  <text x="556" y="191" text-anchor="end" class="mono" font-size="11" fill="#A89F91">Repository →</text>
</svg>
