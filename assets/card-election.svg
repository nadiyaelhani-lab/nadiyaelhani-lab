<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="580" height="230" role="img" aria-label="Election Manager CLI Project Card">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141022"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="85%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strokeAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style><![CDATA[
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes barPulse { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    .cur { animation: blink 1s steps(1) infinite; }
    .stat { animation: barPulse 2.4s ease-in-out infinite; }
  ]]></style>

  <rect x="1.5" y="1.5" width="577" height="227" rx="18" fill="url(#bg)" stroke="url(#strokeAmber)" stroke-width="1.5"/>
  <rect x="2" y="2" width="576" height="226" rx="18" fill="url(#glowAmber)"/>

  <!-- Status Badge -->
  <rect x="24" y="22" width="136" height="24" rx="12" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.6"/>
  <text x="92" y="38" text-anchor="middle" class="mono" font-size="10.5" fill="#C7D2FE" font-weight="600">CLI · ALGORITHMS</text>

  <text x="556" y="38" text-anchor="end" class="mono" font-size="11" fill="#FBBF24">NODE.JS ↗</text>

  <!-- Title & Desc -->
  <text x="24" y="78" class="sans" font-size="22" font-weight="800" fill="#FFFFFF">Election Manager CLI</text>
  <text x="24" y="103" class="sans" font-size="12.5" fill="#94A3B8">Terminal voting engine with CRUD, CIN</text>
  <text x="24" y="122" class="sans" font-size="12.5" fill="#94A3B8">deduplication, bubble-sort &amp; party stats.</text>

  <!-- Mini Animated Terminal Stats Widget -->
  <g transform="translate(382, 54)">
    <rect x="0" y="0" width="174" height="104" rx="12" fill="#0B1120" stroke="#475569" stroke-opacity="0.5"/>
    <text x="12" y="19" class="mono" font-size="8.5" fill="#FBBF24">$ node election.js</text>
    <rect class="cur" x="115" y="11" width="5" height="10" fill="#FBBF24"/>
    <text x="12" y="37" class="mono" font-size="8" fill="#94A3B8">TOP 3 RANKING</text>

    <rect class="stat" x="12" y="44" width="128" height="10" rx="4" fill="#F59E0B"/>
    <text x="146" y="52" class="mono" font-size="8" fill="#FDE68A">#1</text>

    <rect class="stat" x="12" y="60" width="96" height="10" rx="4" fill="#818CF8"/>
    <text x="114" y="68" class="mono" font-size="8" fill="#C7D2FE">#2</text>

    <rect class="stat" x="12" y="76" width="68" height="10" rx="4" fill="#38BDF8"/>
    <text x="86" y="84" class="mono" font-size="8" fill="#BAE6FD">#3</text>

    <text x="12" y="98" class="mono" font-size="7.5" fill="#64748B">CIN LOCK: ACTIVE</text>
  </g>

  <!-- Tech Pills -->
  <line x1="24" y1="172" x2="556" y2="172" stroke="#1E293B" stroke-width="1"/>
  <rect x="24" y="186" width="84" height="24" rx="7" fill="#1E293B" stroke="#FACC15" stroke-opacity="0.45"/>
  <text x="66" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#FEF08A">Node.js</text>

  <rect x="116" y="186" width="98" height="24" rx="7" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.5"/>
  <text x="165" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#C7D2FE">Algorithms</text>

  <rect x="222" y="186" width="70" height="24" rx="7" fill="#0F172A" stroke="#334155"/>
  <text x="257" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">CRUD</text>

  <rect x="300" y="186" width="62" height="24" rx="7" fill="#0F172A" stroke="#334155"/>
  <text x="331" y="202" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">CLI</text>

  <text x="556" y="202" text-anchor="end" class="mono" font-size="10.5" fill="#94A3B8">Click to explore →</text>
</svg>
