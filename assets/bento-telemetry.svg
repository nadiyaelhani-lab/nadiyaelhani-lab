  <style><![CDATA[
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes barReveal {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes lineDraw {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    .b1 { transform-origin: 36px 0; animation: barReveal 1.0s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .b2 { transform-origin: 36px 0; animation: barReveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .b3 { transform-origin: 36px 0; animation: barReveal 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .b4 { transform-origin: 36px 0; animation: barReveal 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .curve { stroke-dasharray: 600; animation: lineDraw 1.8s ease-out forwards; }
  ]]></style>

